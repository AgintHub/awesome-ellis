dag_type: plain_text
description: A workflow to perform the daily idempotent check for the document publication
  cycle, retrieve previous cycle document content as baseline, and concurrently execute
  BI SQL queries for current analysis.
name: daily_idempotent_check_and_bi_sql_data_acquisition
nodes:
  check_existing_document_for_current_cycle:
    agent: false
    description: Check if any listed subdocument title exactly matches the generated
      title for the current analysis cycle to verify if today's report has been published.
    name: check_existing_document_for_current_cycle
    nodes_depended_on:
    - list_subdocuments_in_ai_cases_directory
    - compute_current_analysis_date_range
    nodes_dependent_on:
    - terminate_due_to_existing_document
    - continue_if_document_missing_or_error
    prompt: From the returned list of document titles, search for one that exactly
      matches the title generated for current cycle (e.g., '感知-抓取Gap监控分析（03.19-03.25）').
      If found, output a flag indicating 'found'. If no match or error/permission
      issues are detected, output a flag indicating 'not found or error'.
  compute_current_analysis_date_range:
    agent: false
    description: Calculate the date range (t-8 to t-2) for the current analysis cycle
      and generate the expected document title accordingly.
    name: compute_current_analysis_date_range
    nodes_depended_on: []
    nodes_dependent_on:
    - list_subdocuments_in_ai_cases_directory
    prompt: Calculate the date range from 8 days ago to 2 days ago from today (t).
      Format it as MM.DD-MM.DD. Then generate the expected document title in the format
      '感知-抓取Gap监控分析（MM.DD-MM.DD）'. Return the computed date range and title exactly.
  continue_if_document_missing_or_error:
    agent: false
    description: Formalize continuation of workflow when no current cycle document
      exists or listChildren command errored; ensuring downstream BI SQL queries are
      triggered.
    name: continue_if_document_missing_or_error
    nodes_depended_on:
    - check_existing_document_for_current_cycle
    nodes_dependent_on:
    - execute_bi_sql_queries
    prompt: If the check for existing current cycle document indicates no match found
      or errors occurred, allow the workflow to continue with BI data fetch and document
      draft generation.
  execute_bi_sql_queries:
    agent: false
    description: Concurrently execute the five BI SQL scripts using the sqlFormat
      and hiveQueryBatch tooling to retrieve current cycle analysis data.
    name: execute_bi_sql_queries
    nodes_depended_on:
    - mark_skip_comparative_analysis_in_document_drafting
    - prepare_data_for_comparative_analysis
    - continue_if_document_missing_or_error
    nodes_dependent_on: []
    prompt: Using the BI SQL tools sqlFormat and hiveQueryBatch, concurrently execute
      the five provided SQL scripts to extract current cycle data needed for the analysis
      report. Output all datasets after execution.
  fallback_search_for_previous_document_in_root_directory:
    agent: false
    description: If no prior document found in AI - cases directory, list documents
      in personal root directory and search for latest document titled with '感知-抓取Gap监控分析'.
    name: fallback_search_for_previous_document_in_root_directory
    nodes_depended_on:
    - identify_previous_cycle_document_content_id
    nodes_dependent_on:
    - retrieve_content_of_previous_cycle_document
    - handle_no_previous_document_found
    prompt: Run command 'oa-skills citadel listChildren --mis <用户MIS>' to list documents
      in personal root directory. Search titles for latest document containing '感知-抓取Gap监控分析'.
      Return its contentId if found, else return 'not found'.
  handle_citadel_getdocument_error:
    agent: false
    description: If retrieval of previous document content fails, treat as no previous
      document found and skip comparative analysis step.
    name: handle_citadel_getdocument_error
    nodes_depended_on:
    - retrieve_content_of_previous_cycle_document
    nodes_dependent_on:
    - mark_skip_comparative_analysis_in_document_drafting
    prompt: If the getDocument command returns an error or fails, flag the process
      to skip comparative analysis and note '⚠️ 未找到上一期文档，本期仅展示当前周期数据' in outputs.
  handle_list_children_error:
    agent: false
    description: Handle error or permission issues from listing subdocuments by ignoring
      idempotent check and allowing further workflow to proceed.
    name: handle_list_children_error
    nodes_depended_on:
    - list_subdocuments_in_ai_cases_directory
    nodes_dependent_on:
    - identify_previous_cycle_document_content_id
    prompt: If the listChildren command returned an error or permission denial, ignore
      idempotent check restrictions and proceed with next steps as if no prior documents
      were found.
  handle_no_previous_document_found:
    agent: false
    description: Handle scenario where no previous document could be found (first
      run situation), marking to skip comparative analysis.
    name: handle_no_previous_document_found
    nodes_depended_on:
    - fallback_search_for_previous_document_in_root_directory
    nodes_dependent_on:
    - mark_skip_comparative_analysis_in_document_drafting
    prompt: If no previous document is found in both AI - cases and personal root
      directories, flag the workflow to skip comparative analysis and note in the
      new document '⚠️ 未找到上一期文档，本期仅展示当前周期数据'.
  identify_previous_cycle_document_content_id:
    agent: false
    description: From the subdocuments list under AI - cases directory, find the latest
      document with title containing '感知-抓取Gap监控分析' but excluding current cycle title;
      record its contentId.
    name: identify_previous_cycle_document_content_id
    nodes_depended_on:
    - list_subdocuments_in_ai_cases_directory
    - compute_current_analysis_date_range
    - handle_list_children_error
    nodes_dependent_on:
    - retrieve_content_of_previous_cycle_document
    - fallback_search_for_previous_document_in_root_directory
    prompt: Search the list of document titles to find the latest document whose title
      contains '感知-抓取Gap监控分析' but does not match the current cycle's title. Return
      the contentId of this document. If none found, output a 'not found' flag.
  list_subdocuments_in_ai_cases_directory:
    agent: false
    description: List all subdocuments under the 'AI - cases排查' directory using the
      specified user MIS and fixed parentId.
    name: list_subdocuments_in_ai_cases_directory
    nodes_depended_on:
    - compute_current_analysis_date_range
    nodes_dependent_on:
    - check_existing_document_for_current_cycle
    - handle_list_children_error
    prompt: Run the command 'oa-skills citadel listChildren --mis <用户MIS> --parentId
      2748397739' to retrieve subdocuments under 'AI - cases排查'. Return the list of
      document titles and contentIds if successful, or capture error status/message
      if it fails or permission denied occurs.
  mark_skip_comparative_analysis_in_document_drafting:
    agent: false
    description: Indicate that comparative analysis should be skipped in the final
      document drafting because no dependable prior data is available.
    name: mark_skip_comparative_analysis_in_document_drafting
    nodes_depended_on:
    - handle_no_previous_document_found
    - handle_citadel_getdocument_error
    nodes_dependent_on:
    - execute_bi_sql_queries
    prompt: Flag the downstream processes that no prior cycle's valid data is present,
      and comparative sections in the new document should be omitted or marked with
      '⚠️ 未找到上一期文档，本期仅展示当前周期数据'.
  parse_previous_document_trend_table:
    agent: false
    description: 'Extract from the previous document content the specified data fields
      from the ''一、整体趋势'' table: last cycle date range, Perception GTV, Crawl GTV,
      Gap GTV, recall rates, product recall rates, and area recall rates if present.'
    name: parse_previous_document_trend_table
    nodes_depended_on:
    - retrieve_content_of_previous_cycle_document
    nodes_dependent_on:
    - prepare_data_for_comparative_analysis
    prompt: 'Parse the retrieved previous document content to extract the table named
      ''一、整体趋势''. From this table extract: previous cycle date range, 感知GTV, 抓取GTV,
      Gap GTV, overall 召回率, product-specific 召回率 if any, and battle area 召回率 if any.
      Output these data fields in a structured format.'
  prepare_data_for_comparative_analysis:
    agent: false
    description: Prepare and pass the previous cycle extracted data for integration
      into the new document comparative sections.
    name: prepare_data_for_comparative_analysis
    nodes_depended_on:
    - parse_previous_document_trend_table
    nodes_dependent_on:
    - execute_bi_sql_queries
    prompt: Use the extracted previous cycle baseline data for use in comparative
      sections in the new document. Format data for integration with freshly retrieved
      current cycle results.
  retrieve_content_of_previous_cycle_document:
    agent: false
    description: Retrieve the content of the identified previous cycle document by
      its contentId via citadel command.
    name: retrieve_content_of_previous_cycle_document
    nodes_depended_on:
    - identify_previous_cycle_document_content_id
    - fallback_search_for_previous_document_in_root_directory
    nodes_dependent_on:
    - parse_previous_document_trend_table
    - handle_citadel_getdocument_error
    prompt: If a previous document contentId is available, run 'oa-skills citadel
      getDocument --mis <用户MIS> --contentId <previous_contentId>' to retrieve its
      content. Output the full content or error if command fails.
  terminate_due_to_existing_document:
    agent: false
    description: Terminate workflow early if the document for current analysis cycle
      already exists, outputting a skip message.
    name: terminate_due_to_existing_document
    nodes_depended_on:
    - check_existing_document_for_current_cycle
    nodes_dependent_on: []
    prompt: If the previous step indicates the current cycle document exists, terminate
      all further execution and output '今日已发布，跳过'.
