dag_type: plain_text
description: Workflow to decide where to eat based on availability of meat and then
  go to gym for exercise.
name: eat_and_exercise_routine
nodes:
  check_meat_availability:
    agent: false
    description: Check if there is meat available at home.
    name: check_meat_availability
    nodes_depended_on:
    - go_home
    nodes_dependent_on:
    - eat_at_home
    - drive_to_mall
    prompt: Determine if there is meat available at home. If yes, proceed to eating
      at home; if no, proceed to drive to the mall.
  drive_to_mall:
    agent: false
    description: Drive to the mall because there is no meat at home.
    name: drive_to_mall
    nodes_depended_on:
    - check_meat_availability
    nodes_dependent_on:
    - eat_at_mall
    prompt: Drive to the mall since there is no meat at home.
  eat_at_home:
    agent: false
    description: Eat at home because meat is available.
    name: eat_at_home
    nodes_depended_on:
    - check_meat_availability
    nodes_dependent_on:
    - go_to_gym
    prompt: Eat meat at home as meat is available.
  eat_at_mall:
    agent: false
    description: Eat at the mall after arriving there.
    name: eat_at_mall
    nodes_depended_on:
    - drive_to_mall
    nodes_dependent_on:
    - go_to_gym
    prompt: Eat at the mall after arriving there.
  go_home:
    agent: false
    description: Go home first as the initial step.
    name: go_home
    nodes_depended_on: []
    nodes_dependent_on:
    - check_meat_availability
    prompt: Go home as the starting point of the workflow.
  go_to_gym:
    agent: false
    description: Go to the gym to exercise regardless of where eating took place.
    name: go_to_gym
    nodes_depended_on:
    - eat_at_home
    - eat_at_mall
    nodes_dependent_on: []
    prompt: Go to the gym for exercise after eating.
