dag_type: plain_text
description: A step‑by‑step, technically detailed guide that explains DAG concepts,
  enumerates tooling, identifies core components, outlines creation process with validation,
  and provides reference resources.
name: create_dag_workflow_and_find_references_detailed
nodes:
  define_dag_concept:
    agent: false
    description: Explain the formal definition of a Directed Acyclic Graph (DAG),
      its mathematical properties (directed edges, absence of cycles, partial order),
      and why these properties matter for workflow orchestration.
    name: define_dag_concept
    nodes_depended_on: []
    nodes_dependent_on:
    - identify_dag_component_elements
    - list_dag_creation_use_cases
    prompt: Provide a concise technical definition of a Directed Acyclic Graph (DAG).
      Mention its representation as G = (V, E) with V as vertices and E as directed
      edges, the requirement that G contains no directed cycles, and how this yields
      a partial order useful for scheduling tasks in pipelines.
  enumerate_tools_and_references:
    agent: false
    description: List concrete platforms, libraries, and documentation sources where
      validated DAG examples and best‑practice guides can be found.
    name: enumerate_tools_and_references
    nodes_depended_on:
    - validate_acyclicity
    nodes_dependent_on:
    - summarize_dag_creation_guide
    prompt: 'Provide a curated list of DAG tooling and reference material, including:
      • Apache Airflow (official docs, GitHub examples) • Prefect (API reference,
      community flows) • Luigi (tutorials, code snippets) • Dagster (type‑safe pipelines)
      • Open‑source repositories on GitHub tagged with ''dag'' • Academic papers on
      DAG scheduling algorithms.'
  identify_dag_component_elements:
    agent: false
    description: 'Detail the atomic elements of a DAG workflow: tasks as nodes, dependency
      edges, and essential properties such as atomicity, idempotence, and explicit
      acyclicity checks.'
    name: identify_dag_component_elements
    nodes_depended_on:
    - define_dag_concept
    nodes_dependent_on:
    - outline_basic_dag_creation_process
    prompt: 'List and technically describe each core component of a DAG workflow:
      • Task/node – an indivisible unit of work with a unique identifier and optional
      metadata. • Edge – a directed dependency indicating that the target node cannot
      start before the source completes. • Properties – atomic execution, idempotent
      behavior, and the guarantee that the graph remains acyclic. Include brief examples
      of how these are expressed in code (e.g., Airflow Operators, Prefect Tasks).'
  list_dag_creation_use_cases:
    agent: false
    description: Enumerate typical, technically oriented use cases for DAGs, focusing
      on concrete pipeline scenarios and required performance characteristics.
    name: list_dag_creation_use_cases
    nodes_depended_on:
    - define_dag_concept
    nodes_dependent_on:
    - outline_basic_dag_creation_process
    prompt: 'Provide a bullet‑list of real‑world DAG applications, such as: • ETL
      pipelines with data extraction, transformation, and load stages. • Machine‑learning
      model training workflows with feature engineering, training, validation, and
      deployment steps. • CI/CD pipelines where build, test, and deploy jobs have
      strict ordering. • Periodic batch jobs that need maximum concurrency while respecting
      data dependencies.'
  outline_basic_dag_creation_process:
    agent: false
    description: Present a detailed, ordered procedure for constructing a DAG, from
      task enumeration to dependency mapping and concurrency planning.
    name: outline_basic_dag_creation_process
    nodes_depended_on:
    - identify_dag_component_elements
    - list_dag_creation_use_cases
    nodes_dependent_on:
    - validate_acyclicity
    prompt: 'Write a step‑by‑step guide: 1) Enumerate all atomic tasks and assign
      identifiers. 2) For each task, specify required upstream tasks. 3) Build the
      adjacency list or matrix representing edges. 4) Perform a topological sort to
      verify ordering and expose parallelizable branches. 5) Document concurrency
      limits and resource requirements per task.'
  summarize_dag_creation_guide:
    agent: false
    description: Combine all previous outputs into a concise, actionable guide that
      a practitioner can follow to design, validate, and locate examples of DAG workflows.
    name: summarize_dag_creation_guide
    nodes_depended_on:
    - enumerate_tools_and_references
    nodes_dependent_on: []
    prompt: 'Synthesize a final guide that: 1) Recaps the DAG definition and component
      details. 2) Summarizes the creation process with validation steps. 3) Highlights
      concurrency considerations from the topological sort. 4) Lists the tooling and
      reference resources. Present the guide in clear sections with code snippets
      where appropriate.'
  validate_acyclicity:
    agent: false
    description: Apply a technical algorithm (e.g., depth‑first search cycle detection
      or Kahn's algorithm) to ensure the constructed graph contains no cycles, and
      output diagnostics if cycles are found.
    name: validate_acyclicity
    nodes_depended_on:
    - outline_basic_dag_creation_process
    nodes_dependent_on:
    - enumerate_tools_and_references
    prompt: Given the adjacency representation from the previous step, run Kahn's
      algorithm to attempt a topological ordering. If the ordering succeeds, confirm
      the graph is acyclic. If it fails, list the nodes involved in the cycle and
      suggest minimal edge removals to break it.
