dag_type: plain_text
description: Provides a brief guide on how to create a DAG workflow and then generates
  the Chinese character '你'.
name: dag_creation_guide_and_character_generation
nodes:
  explain_dag_creation:
    agent: false
    description: Gives a concise tutorial on creating a DAG and provides reference
      links.
    name: explain_dag_creation
    nodes_depended_on: []
    nodes_dependent_on:
    - generate_you_character
    prompt: Explain in Chinese how to create a DAG workflow, including the basic steps
      (define nodes, set dependencies, ensure acyclicity) and give at least one reference
      URL where the user can read more about DAG design.
  generate_you_character:
    agent: false
    description: Generate the Chinese character you.
    name: generate_you_character
    nodes_depended_on:
    - explain_dag_creation
    nodes_dependent_on: []
    prompt: Generate the Chinese character '你' as the sole output.
