dag_type: plain_text
description: Creates the expected document title for the current analysis period,
  checks for an existing document in the AI‑cases‑排查 directory, and if not present
  reads the previous period's document to extract baseline metrics.
name: gap_monitor_analysis_workflow
nodes:
  compute_date_range:
    agent: false
    description: Calculate the current analysis period dates (t‑8 to t‑2) and format
      them as MM.DD‑MM.DD.
    name: compute_date_range
    nodes_depended_on: []
    nodes_dependent_on:
    - generate_document_title
    prompt: Using the current date, compute the start date as 8 days ago and the end
      date as 2 days ago. Output the range in the format "MM.DD‑MM.DD".
  extract_baseline_metrics:
    agent: false
    description: Parse the previous period document (if any) and extract required
      fields from the "一、整体趋势" table.
    name: extract_baseline_metrics
    nodes_depended_on:
    - fetch_previous_content
    - fallback_personal_search
    nodes_dependent_on:
    - final_output
    prompt: 'From the document JSON (if present), locate the table titled "一、整体趋势"
      and extract:

      - 上一期日期范围

      - 感知GTV、抓取GTV、Gap GTV、召回率

      - 各产品形态召回率（如有）

      - 各战区召回率（如有）

      If no document is available, set a flag `no_baseline=true` and note that baseline
      data is missing.'
  fallback_personal_search:
    agent: false
    description: If no prior document was found in the folder, search the user's root
      directory for the latest matching document.
    name: fallback_personal_search
    nodes_depended_on:
    - read_previous_document
    nodes_dependent_on:
    - extract_baseline_metrics
    prompt: 'Execute:

      ```

      oa-skills citadel listChildren --mis <用户MIS>

      ```

      Search the returned list for the newest document whose title contains "感知-抓取Gap监控分析".
      Return its `contentId` and, if found, fetch its content with the same `getDocument`
      command as above.'
  fetch_previous_content:
    agent: false
    description: Retrieve the full content of the previous period document using its
      contentId.
    name: fetch_previous_content
    nodes_depended_on:
    - read_previous_document
    nodes_dependent_on:
    - extract_baseline_metrics
    - fallback_personal_search
    prompt: 'If a `contentId` was obtained, run:

      ```

      oa-skills citadel getDocument --mis <用户MIS> --contentId <contentId>

      ```

      Return the document JSON. If `contentId` is empty, skip this step.'
  final_output:
    agent: false
    description: 'Produce the final result: the generated title and either the extracted
      baseline metrics or a warning if none were found.'
    name: final_output
    nodes_depended_on:
    - idempotent_check
    - extract_baseline_metrics
    nodes_dependent_on: []
    prompt: 'If `skip_remaining` is true, output the message from `idempotent_check`
      and stop.

      Otherwise, output:

      ```

      标题: <generated title>


      基准数据:

      <extracted metrics or warning>

      ```'
  generate_document_title:
    agent: false
    description: Build the expected document title using the calculated date range.
    name: generate_document_title
    nodes_depended_on:
    - compute_date_range
    nodes_dependent_on:
    - list_directory_children
    prompt: Insert the date range from the previous step into the template "感知-抓取Gap监控分析（<range>）"
      and output the full title string.
  idempotent_check:
    agent: false
    description: Determine whether a document with the expected title already exists;
      if so, terminate the workflow.
    name: idempotent_check
    nodes_depended_on:
    - list_directory_children
    - generate_document_title
    nodes_dependent_on:
    - read_previous_document
    prompt: Parse the output from `list_directory_children`. If any child's title
      exactly matches the title from `generate_document_title`, output the message
      "今日已发布，跳过" and set a flag `skip_remaining=true`. Otherwise set `skip_remaining=false`.
  list_directory_children:
    agent: false
    description: Run the citadel command to list child documents under the 【AI - cases排查】
      folder.
    name: list_directory_children
    nodes_depended_on:
    - generate_document_title
    nodes_dependent_on:
    - idempotent_check
    prompt: 'Execute the command:

      ```

      oa-skills citadel listChildren --mis <用户MIS> --parentId 2748397739

      ```

      Return the raw command output (JSON or text).'
  read_previous_document:
    agent: false
    description: When no current document exists, locate the most recent prior period
      document and retrieve its contentId.
    name: read_previous_document
    nodes_depended_on:
    - idempotent_check
    nodes_dependent_on:
    - fetch_previous_content
    prompt: From the list obtained in `list_directory_children`, find the latest document
      whose title contains "感知-抓取Gap监控分析" but whose date range differs from the current
      one. Return its `contentId`. If none is found, leave `contentId` empty.
